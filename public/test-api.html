<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste API de Ações</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-box {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        input {
            padding: 10px;
            width: 300px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            background: #1a73e8;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        #resultado {
            margin-top: 20px;
            white-space: pre-wrap;
            background: white;
            padding: 15px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>🔧 Teste da API de Ações</h1>
    
    <div class="test-box">
        <h3>1. Testar Busca de Ações</h3>
        <input type="text" id="busca" placeholder="Digite: PETR, VALE, etc" value="PETR">
        <button onclick="testarBusca()">Buscar</button>
    </div>
    
    <div class="test-box">
        <h3>2. Testar Banco de Dados Direto</h3>
        <button onclick="testarBanco()">Verificar Tabela stock_prices</button>
    </div>
    
    <div id="resultado"></div>
    
    <script>
        const BASE_URL = '/fin-control/public';
        
        async function testarBusca() {
            const query = document.getElementById('busca').value;
            const resultado = document.getElementById('resultado');
            
            resultado.innerHTML = '<strong>Buscando...</strong>';
            
            try {
                const response = await fetch(`${BASE_URL}/api/stocks.php?action=search&q=${query}`);
                const data = await response.json();
                
                resultado.innerHTML = `
<strong>✅ API respondeu!</strong>
Status: ${response.status}
Dados recebidos:
${JSON.stringify(data, null, 2)}
                `;
            } catch (error) {
                resultado.innerHTML = `
<strong>❌ Erro!</strong>
${error.message}
                `;
            }
        }
        
        async function testarBanco() {
            const resultado = document.getElementById('resultado');
            resultado.innerHTML = '<strong>Verificando banco...</strong>';
            
            try {
                const response = await fetch(`${BASE_URL}/test-db.php`);
                const text = await response.text();
                resultado.innerHTML = text;
            } catch (error) {
                resultado.innerHTML = `<strong>❌ Erro:</strong> ${error.message}`;
            }
        }
    </script>
</body>
</html>
